# ==============================================================================
# AI ScholarTwin — Production Profile Configuration (application-prod.yml)
# ==============================================================================

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: ai-scholartwin
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/ai_scholartwin?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:scholartwin_user}
    password: ${SPRING_DATASOURCE_PASSWORD:scholartwin_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: ${DOCUMENT_MAX_FILE_SIZE:100MB}
      max-request-size: ${DOCUMENT_MAX_REQUEST_SIZE:110MB}

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:80,http://localhost}
  document:
    storage-dir: ${DOCUMENT_STORAGE_DIR:/app/uploads/documents}
    max-file-size-bytes: ${DOCUMENT_MAX_FILE_SIZE_BYTES:104857600}
    max-page-count: ${DOCUMENT_MAX_PAGE_COUNT:200}
    chunk-max-size: ${DOCUMENT_CHUNK_MAX_SIZE:1000}
    chunk-overlap: ${DOCUMENT_CHUNK_OVERLAP:150}
  resume:
    max-file-size-bytes: ${RESUME_MAX_FILE_SIZE_BYTES:20971520}
  ocr:
    enabled: ${OCR_ENABLED:true}
    tesseract-path: ${TESSERACT_PATH:tesseract}
    language: ${OCR_LANGUAGE:eng}

gemini:
  api:
    key: ${GEMINI_API_KEY:}
  model:
    name: ${GEMINI_MODEL:gemini-2.5-flash}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
