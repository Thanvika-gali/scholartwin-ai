# ==============================================================================
# AI ScholarTwin — Application Configuration (Milestone 1)
# ==============================================================================

# Server Configuration
server.port=8080

# Application Branding
spring.application.name=ai-scholartwin

# Database Configuration (Configured via Environment Variables with Fallbacks)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ai_scholartwin?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:scholartwin_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:scholartwin_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
# Allow non-blocking initialization so the server can start and genuinely report connectivity state
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=10

# Spring Data JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ==============================================================================
# Document Processing & Knowledge Extraction Configuration (Milestone 4 & Improvement Pass)
# ==============================================================================
spring.servlet.multipart.max-file-size=${DOCUMENT_MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${DOCUMENT_MAX_REQUEST_SIZE:110MB}

# Storage directory (relative to workspace or absolute)
app.document.storage-dir=${DOCUMENT_STORAGE_DIR:uploads/documents}
app.document.max-file-size-bytes=${DOCUMENT_MAX_FILE_SIZE_BYTES:104857600}
app.document.max-page-count=${DOCUMENT_MAX_PAGE_COUNT:200}

# Resume Upload Configuration
app.resume.max-file-size-bytes=${RESUME_MAX_FILE_SIZE_BYTES:20971520}

# Chunking Strategy
app.document.chunk-max-size=${DOCUMENT_CHUNK_MAX_SIZE:1000}
app.document.chunk-overlap=${DOCUMENT_CHUNK_OVERLAP:150}

# OCR Configuration (Tesseract Integration)
app.ocr.enabled=${OCR_ENABLED:true}
app.ocr.tesseract-path=${TESSERACT_PATH:tesseract}
app.ocr.language=${OCR_LANGUAGE:eng}

